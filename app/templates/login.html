{% extends "base.html" %}
{% block title %}Log in — The Sweet Circuit{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Welcome back</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Handle <input name="handle" required placeholder="your handle"></label>
    <label>Password <input name="password" type="password" required></label>
    <button class="btn big" type="submit">Log in</button>
  </form>
  <p>New here? <a href="/signup">Join the Circuit</a></p>
</div>
{% endblock %}
