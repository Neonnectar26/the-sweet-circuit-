{% extends "base.html" %}
{% block title %}Sign up — The Sweet Circuit{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Join the Circuit</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/signup">
    <label>Handle <input name="handle" required minlength="2" maxlength="24" placeholder="your handle"></label>
    <label>Email <input name="email" type="email" required placeholder="you@example.com"></label>
    <label>Password <input name="password" type="password" required minlength="8" placeholder="8+ characters"></label>
    <button class="btn big" type="submit">Create account</button>
  </form>
  <p>Already hanging around? <a href="/login">Log in</a></p>
</div>
{% endblock %}
